name: Validate codex-desarrollo

on:
  workflow_dispatch:
  push:
    branches:
      - codex-desarrollo
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/validate-codex.yml"

permissions:
  contents: read

concurrency:
  group: validate-codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Install project Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
