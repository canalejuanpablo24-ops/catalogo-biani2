name: Validate codex-desarrollo

on:
  workflow_dispatch:
  push:
    branches:
      - codex-desarrollo
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/validate-codex.yml"

permissions:
  contents: read

concurrency:
  group: validate-codex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit and browser validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout codex-desarrollo
        uses: actions/checkout@v4
        with:
          ref: codex-desarrollo
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: npm ci || npm install

      - name: Run lint and unit tests
        run: npm run validate

      - name: Install Playwright for validation only
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npx playwright test --config=playwright.config.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
