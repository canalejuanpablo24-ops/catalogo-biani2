name: Prepare empty Cloudflare QA project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Create empty biani-qa project without deployment
    if: github.ref == 'refs/heads/codex-desarrollo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: biani-qa
    permissions:
      contents: read
    steps:
      - name: Create empty Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create biani-qa --production-branch qa-production-disabled
