<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo BIANI · Lista de Precios</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="robots" content="noindex, nofollow">

  <!-- Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- External Design System Styles -->
  <link rel="stylesheet" href="src/ui/styles.css">
</head>
<body>

  <!-- LOADER OVERLAY -->
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p style="margin-top: 14px; font-weight: 700; color: var(--az);">Cargando catálogo...</p>
  </div>

  <!-- HEADER -->
  <header class="hd">
    <a href="#" class="logo-container">
      <div id="logoBox" class="logo-box">B</div>
      <div class="logo-title-group">
        <span id="logoText" class="logo-text">BIANI</span>
        <span id="logoSubtitle" class="logo-subtitle">Lista de Precios</span>
      </div>
    </a>

    <div class="ha">
      <button id="cartBtn" class="cb btn-cart" aria-label="Ver carrito de compras">
        <span>🛒 Mi Pedido</span>
        <span id="cartBadge" class="cc" style="display: none;">0</span>
      </button>
    </div>
  </header>

  <!-- SEARCH BANNER -->
  <div class="search-banner">
    <div class="sw">
      <span class="si">🔍</span>
      <input type="text" id="searchInp" placeholder="Buscar por producto, código o marca..." aria-label="Buscar producto">
      <button id="clearSearch" class="clear-search-btn" title="Limpiar búsqueda">✕</button>
    </div>
  </div>

  <!-- SYNC BANNER -->
  <div id="syncBanner" class="sync-banner">
    <span>⏳ Conectando con Google Sheets...</span>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="catalog-container">
    
    <!-- SIDEBAR CATEGORIES NAVIGATION -->
    <aside class="catalog-sidebar">
      <div class="sidebar-sec-title">Grupos de productos</div>
      <nav id="nav1" class="nav1"></nav>

      <div class="sidebar-sec-title" style="margin-top: 20px;">Categorías</div>
      <nav id="nav2" class="nav2"></nav>
    </aside>

    <!-- MAIN PRODUCT GRID SECTION -->
    <main class="catalog-main">
      <div class="catalog-header-bar">
        <h1 id="ctitle" class="ctitle">Catálogo de Productos</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 13px; color: var(--g3); font-weight: 600;">Sort:</span>
          <select id="sortSel" class="sort-select">
            <option value="default">Orden por defecto</option>
            <option value="name">Nombre (A-Z)</option>
            <option value="price-asc">Menor precio</option>
            <option value="price-desc">Mayor precio</option>
          </select>
          <span style="font-size: 13px; color: var(--g3); font-weight: 600;">Total: <strong id="pcnt" style="color: var(--az)">0</strong></span>
        </div>
      </div>

      <!-- PRODUCT GRID -->
      <section id="grid" class="grid"></section>
    </main>

  </div>

  <!-- SHOPPING CART MODAL -->
  <div id="cartModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">🛒 Mi Pedido de Compras</h2>
        <button id="closeCart" class="close-btn" aria-label="Cerrar modal">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- Customer Info Form -->
        <div style="margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px;">
          <input type="text" id="custName" placeholder="Tu Nombre o Comercio (Opcional)" style="padding: 10px; border-radius: 8px; border: 1px solid var(--g2); font-family: inherit;">
          <input type="text" id="custAddr" placeholder="Dirección de entrega (Opcional)" style="padding: 10px; border-radius: 8px; border: 1px solid var(--g2); font-family: inherit;">
        </div>

        <div id="cartList"></div>
      </div>

      <div class="cart-footer">
        <div class="cart-total-row">
          <span>TOTAL ESTIMADO:</span>
          <span id="cartTotal">$ 0,00</span>
        </div>
        <button id="checkoutBtn" class="checkout-btn">
          <span>📲 Enviar Pedido por WhatsApp</span>
        </button>
        <button id="clearCartBtn" style="width: 100%; margin-top: 10px; padding: 10px; background: transparent; border: none; color: var(--rd); font-size: 13px; font-weight: 600; cursor: pointer;">
          Vaciar Carrito
        </button>
      </div>
    </div>
  </div>

  <!-- APPLICATION ENTRY MODULE -->
  <script type="module" src="src/ui/app.js"></script>

</body>
</html>
