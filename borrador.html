<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#101826">
  <title>Borrador · Catálogo BIANI</title>
  <style>
    :root{--ink:#111827;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--card:#fff;--brand:#b88924;--brand2:#8b6518;--dark:#101826;--ok:#128c4b;--danger:#b42318;--shadow:0 8px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select,textarea{font:inherit}.hidden{display:none!important}
    .top{position:sticky;top:0;z-index:30;background:rgba(16,24,38,.96);backdrop-filter:blur(10px);color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.16)}
    .top-inner{max-width:1500px;margin:auto;padding:12px 18px;display:grid;grid-template-columns:auto minmax(260px,1fr) auto;align-items:center;gap:16px}
    .brand{display:flex;align-items:center;gap:12px;min-width:max-content}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#d8b75f,var(--brand2));display:grid;place-items:center;font-weight:900;font-size:24px;color:#111;box-shadow:inset 0 1px rgba(255,255,255,.6)}
    .brand strong{display:block;font-size:18px;letter-spacing:.08em}.brand small{display:block;color:#cbd5e1;margin-top:2px}
    .search{position:relative}.search input{width:100%;height:46px;border:1px solid #334155;border-radius:14px;padding:0 46px 0 44px;background:#fff;color:#111;outline:none}.search input:focus{box-shadow:0 0 0 4px rgba(184,137,36,.25);border-color:#d1a53f}.search .ico{position:absolute;left:15px;top:12px;color:#64748b}.search button{position:absolute;right:8px;top:7px;width:32px;height:32px;border:0;border-radius:9px;background:#eef2f7;cursor:pointer}
    .cart-btn{border:1px solid #475569;background:#fff;color:#111827;border-radius:14px;height:46px;padding:0 16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:9px}.cart-count{min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--brand);display:grid;place-items:center;color:#111;font-size:12px}
    .status{max-width:1500px;margin:12px auto 0;padding:0 18px}.status-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;box-shadow:0 2px 8px rgba(15,23,42,.04)}.status-box.ok{border-left:4px solid var(--ok)}.status-box.warn{border-left:4px solid #d97706}.status-box.bad{border-left:4px solid var(--danger)}
    .layout{max-width:1500px;margin:14px auto;padding:0 18px 50px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px}
    .side{position:sticky;top:84px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 104px);overflow:auto}.side h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 6px 12px}.cat{width:100%;border:0;background:transparent;border-radius:11px;padding:10px 11px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;text-align:left;color:#334155}.cat:hover{background:#f8fafc}.cat.active{background:#fff7e6;color:#754e00;font-weight:800}.cat span:last-child{font-size:12px;background:#eef2f7;border-radius:99px;padding:2px 7px;color:#64748b}
    .main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 14px}.main-head h1{font-size:26px;margin:0}.main-head p{margin:5px 0 0;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools select,.tools button{height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 12px;color:#334155}.tools button{cursor:pointer}.tools button.active{background:#fff7e6;border-color:#d6a638;color:#754e00;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 3px 14px rgba(15,23,42,.055);display:flex;flex-direction:column;min-width:0;transition:.18s transform,.18s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .pic{aspect-ratio:1/1;background:linear-gradient(145deg,#fff,#f1f5f9);position:relative;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;padding:10px}.badge{position:absolute;top:10px;left:10px;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900;background:#fff3cd;color:#6b4b00;border:1px solid #f0d58a}.badge.stock{background:#fee4e2;color:#912018;border-color:#f4a7a1}.body{padding:13px;display:flex;flex-direction:column;gap:9px;flex:1}.code{font-size:11px;color:var(--muted);font-weight:700}.name{font-size:14px;line-height:1.35;font-weight:800;min-height:38px}.price{font-size:21px;font-weight:900;color:#0f172a}.min{font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 42px;gap:7px;margin-top:auto}.add{border:0;background:var(--dark);color:#fff;border-radius:11px;padding:10px;font-weight:800;cursor:pointer}.add:hover{background:#263449}.qty{border:1px solid var(--line);background:#fff;border-radius:11px;cursor:pointer;font-weight:900}
    .empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;padding:55px 20px;text-align:center;color:var(--muted)}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:none;justify-content:flex-end}.overlay.open{display:flex}.drawer{width:min(520px,100%);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-15px 0 40px rgba(0,0,0,.2)}.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0}.x{border:0;background:#eef2f7;width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:20px}.cart-list{padding:16px 20px;overflow:auto;flex:1}.cart-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.cart-item strong{font-size:13px}.cart-item small{display:block;color:var(--muted);margin-top:4px}.step{display:flex;align-items:center;gap:6px}.step button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}.step b{min-width:30px;text-align:center}.remove{border:0;background:none;color:var(--danger);cursor:pointer;font-size:12px;padding:4px 0}.form{padding:16px 20px;border-top:1px solid var(--line);background:#f8fafc}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#475569}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff}.field textarea{resize:vertical;min-height:60px}.totals{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}.totals strong{font-size:22px}.send{width:100%;border:0;background:#25d366;color:#083b1b;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}.send:disabled{opacity:.45;cursor:not-allowed}.error{color:var(--danger);font-size:12px;min-height:17px;margin:7px 0}.mobile-cats{display:none}
    .loader{position:fixed;inset:0;z-index:100;background:rgba(245,247,251,.92);display:grid;place-items:center}.loader-box{text-align:center}.spin{width:46px;height:46px;border-radius:50%;border:4px solid #dce3ec;border-top-color:var(--brand);animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:850px){.top-inner{grid-template-columns:1fr auto}.search{grid-column:1/-1;grid-row:2}.brand small{display:none}.layout{grid-template-columns:1fr;padding-left:12px;padding-right:12px}.side{display:none}.mobile-cats{display:flex;overflow:auto;gap:8px;margin-bottom:12px;padding-bottom:3px}.mobile-cats .cat{width:auto;white-space:nowrap;background:#fff;border:1px solid var(--line)}.main-head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.name{font-size:13px}.price{font-size:18px}.status{padding:0 12px}.status-box{flex-direction:column}.cart-btn .cart-label{display:none}}
    @media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.qty{display:none}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <div id="loader" class="loader"><div class="loader-box"><div class="spin"></div><p><strong>Cargando catálogo BIANI…</strong></p><small>Conectando con Google Sheets</small></div></div>
  <header class="top"><div class="top-inner">
    <div class="brand"><div class="mark">B</div><div><strong>BIANI</strong><small>Distribuidora mayorista · Vendedor Juan</small></div></div>
    <div class="search"><span class="ico">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Buscar por producto, marca o código…" aria-label="Buscar productos"><button id="clear" aria-label="Limpiar búsqueda">×</button></div>
    <button id="openCart" class="cart-btn" aria-label="Abrir carrito"><span>🛒</span><span class="cart-label">Pedido</span><span id="cartCount" class="cart-count">0</span></button>
  </div></header>
  <div class="status"><div id="status" class="status-box"><span>Preparando catálogo…</span><span>Borrador de prueba · No modifica producción</span></div></div>
  <div class="layout">
    <aside class="side"><h2>Categorías</h2><div id="categories"></div></aside>
    <main><div id="mobileCats" class="mobile-cats"></div><div class="main-head"><div><h1 id="title">Todos los productos</h1><p><span id="count">0</span> productos disponibles</p></div><div class="tools"><button id="sinTacc">✓ Solo SIN TACC</button><select id="sort" aria-label="Ordenar productos"><option value="default">Orden original</option><option value="name">Nombre A–Z</option><option value="priceAsc">Menor precio</option><option value="priceDesc">Mayor precio</option></select></div></div><section id="grid" class="grid" aria-live="polite"></section></main>
  </div>
  <div id="cartOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Carrito de pedido"><div class="drawer"><div class="drawer-head"><div><h2>Tu pedido</h2><small id="cartSubtitle">Todavía no agregaste productos</small></div><button id="closeCart" class="x" aria-label="Cerrar carrito">×</button></div><div id="cartList" class="cart-list"></div><div class="form"><div class="fields"><div class="field full"><label for="customer">Nombre o comercio *</label><input id="customer" autocomplete="name" placeholder="Ej.: Kiosco El Centro"></div><div class="field"><label for="docType">Documento</label><select id="docType"><option>DNI</option><option>CUIT</option></select></div><div class="field"><label for="document">Número</label><input id="document" inputmode="numeric" placeholder="Sin puntos ni guiones"></div><div class="field"><label for="city">Localidad *</label><input id="city" placeholder="Localidad"></div><div class="field"><label for="address">Dirección *</label><input id="address" autocomplete="street-address" placeholder="Calle y número"></div><div class="field full"><label for="notes">Observaciones</label><textarea id="notes" placeholder="Entre calles, horario de entrega, etc."></textarea></div></div><div id="formError" class="error"></div><div class="totals"><span>Total estimado</span><strong id="total">$ 0</strong></div><button id="send" class="send" disabled>Enviar pedido por WhatsApp</button></div></div></div>
<script>
(()=>{
  'use strict';
  const SHEET_ID='179n3Fa7WUbA1ZlgtAVVlIaxbQdaP5CV49NhPY0Ulrn0';
  const WA='5492954324063';
  const PROD='https://biani.com.ar/';
  const $=s=>document.querySelector(s);
  const state={products:[],filtered:[],category:'',query:'',sinTacc:false,sort:'default',cart:JSON.parse(localStorage.getItem('biani_draft_cart')||'{}')};
  const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(n)||0);
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;}else if(c==='"'){q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
  const num=v=>{let s=String(v||'').replace(/[$\s]/g,'');if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');return Number(s.replace(/[^0-9.-]/g,''))||0;};
  function rowToProduct(headers,row,maps){const get=(...names)=>{for(const n of names){const i=headers.findIndex(h=>norm(h)===norm(n));if(i>=0&&row[i]!=null)return row[i].trim();}return''};const code=get('codigo','código','cod','id','articulo','artículo');const name=get('descripcion','descripción','producto','nombre','detalle');const price=num(get('precio','precio venta','venta','p. venta','importe'));if(!code||!name)return null;let image=maps.images[code]||'';if(image&&!/^https?:|^data:/.test(image))image=PROD+image.replace(/^\.\//,'');let category=maps.categories[code]||get('categoria','categoría','rubro')||'Varios';return{code:String(code),name,price,category,image,min:Math.max(1,Math.round(num(get('unidad_min','minimo','mínimo','cantidad minima'))||1)),stock:!price};}
  async function getJson(path){try{const r=await fetch(PROD+path+'?v='+Date.now(),{cache:'no-store'});return r.ok?await r.json():{};}catch{return{};}}
  async function load(){const status=$('#status');try{const [images,categories]=await Promise.all([getJson('code_to_image.json'),getJson('code_to_category.json')]);const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&v=${Date.now()}`;const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('Google Sheets respondió '+r.status);const rows=parseCSV(await r.text());if(rows.length<2)throw new Error('La planilla no devolvió productos');const headers=rows[0];const products=rows.slice(1).map(row=>rowToProduct(headers,row,{images,categories})).filter(Boolean);if(products.length<50)throw new Error('La actualización parece incompleta ('+products.length+' productos)');state.products=products;status.className='status-box ok';status.innerHTML=`<span>✅ Catálogo conectado a Google Sheets · ${products.length.toLocaleString('es-AR')} productos</span><span>Actualizado ${new Date().toLocaleString('es-AR')}</span>`;renderCategories();apply();}catch(e){status.className='status-box bad';status.innerHTML=`<span>⚠️ No se pudo cargar la planilla: ${esc(e.message)}</span><span>El borrador no reemplaza el catálogo actual</span>`;$('#grid').innerHTML='<div class="empty"><h2>No pudimos cargar los productos</h2><p>Revisá que la planilla siga compartida como lector y recargá la página.</p></div>';}finally{$('#loader').classList.add('hidden');}}
  function renderCategories(){const counts={};state.products.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);const cats=Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0],'es'));const html=[['','Todos',state.products.length],...cats.map(([c,n])=>[c,c,n])].map(([v,l,n])=>`<button class="cat ${state.category===v?'active':''}" data-cat="${esc(v)}"><span>${esc(l)}</span><span>${n}</span></button>`).join('');$('#categories').innerHTML=html;$('#mobileCats').innerHTML=html;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;$('#title').textContent=state.category||'Todos los productos';renderCategories();apply();window.scrollTo({top:0,behavior:'smooth'});});}
  function apply(){let a=[...state.products];if(state.category)a=a.filter(p=>p.category===state.category);if(state.query){const q=norm(state.query);a=a.filter(p=>norm(p.name).includes(q)||norm(p.code).includes(q)||norm(p.category).includes(q));}if(state.sinTacc)a=a.filter(p=>/sin\s*tacc|sin\s*tac/i.test(p.name));if(state.sort==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'es'));if(state.sort==='priceAsc')a.sort((x,y)=>x.price-y.price);if(state.sort==='priceDesc')a.sort((x,y)=>y.price-x.price);state.filtered=a;renderProducts();}
  function placeholder(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#f1f5f9"/><path d="M70 210l55-60 38 40 30-32 42 52" fill="none" stroke="#94a3b8" stroke-width="8"/><circle cx="105" cy="105" r="18" fill="#cbd5e1"/><text x="150" y="255" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">BIANI</text></svg>');}
  function renderProducts(){const g=$('#grid');$('#count').textContent=state.filtered.length.toLocaleString('es-AR');if(!state.filtered.length){g.innerHTML='<div class="empty"><h2>No encontramos productos</h2><p>Probá otra búsqueda o categoría.</p></div>';return;}g.innerHTML=state.filtered.map(p=>`<article class="card"><div class="pic">${p.image?'':`<span class="badge">Sin foto</span>`}${p.stock?'<span class="badge stock">Sin stock</span>':''}<img loading="lazy" src="${esc(p.image||placeholder())}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src='${placeholder()}'"></div><div class="body"><div class="code">CÓD. ${esc(p.code)} · ${esc(p.category)}</div><div class="name">${esc(p.name)}</div><div><div class="price">${money(p.price)}</div><div class="min">${p.min>1?'Compra mínima: '+p.min+' unidades':'Venta por unidad'}</div></div><div class="actions"><button class="add" data-add="${esc(p.code)}" ${p.stock?'disabled':''}>${state.cart[p.code]?'Agregar otra':'Agregar al pedido'}</button><button class="qty" data-quick="${esc(p.code)}" aria-label="Agregar cantidad mínima">+${p.min}</button></div></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add,1));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.code===b.dataset.quick);add(p.code,p.min);});}
  function add(code,qty){const p=state.products.find(x=>x.code===code);if(!p)return;state.cart[code]=(state.cart[code]||0)+qty;saveCart();renderCart();renderProducts();}
  function saveCart(){localStorage.setItem('biani_draft_cart',JSON.stringify(state.cart));$('#cartCount').textContent=Object.values(state.cart).reduce((a,b)=>a+b,0);}
  function cartItems(){return Object.entries(state.cart).map(([code,qty])=>({p:state.products.find(x=>x.code===code),qty})).filter(x=>x.p&&x.qty>0);}
  function renderCart(){const items=cartItems(),list=$('#cartList');$('#cartSubtitle').textContent=items.length?items.length+' productos diferentes':'Todavía no agregaste productos';if(!items.length)list.innerHTML='<div class="empty"><h3>El carrito está vacío</h3><p>Agregá productos desde el catálogo.</p></div>';else list.innerHTML=items.map(({p,qty})=>`<div class="cart-item"><div><strong>${esc(p.name)}</strong><small>${esc(p.code)} · ${money(p.price)} c/u · Subtotal ${money(p.price*qty)}</small><button class="remove" data-remove="${esc(p.code)}">Eliminar</button></div><div class="step"><button data-minus="${esc(p.code)}">−</button><b>${qty}</b><button data-plus="${esc(p.code)}">+</button></div></div>`).join('');const total=items.reduce((s,x)=>s+x.p.price*x.qty,0);$('#total').textContent=money(total);$('#send').disabled=!items.length;document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>change(b.dataset.minus,-1));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>change(b.dataset.plus,1));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete state.cart[b.dataset.remove];saveCart();renderCart();renderProducts();});}
  function change(code,d){state.cart[code]=(state.cart[code]||0)+d;if(state.cart[code]<=0)delete state.cart[code];saveCart();renderCart();renderProducts();}
  function validate(){const customer=$('#customer').value.trim(),city=$('#city').value.trim(),address=$('#address').value.trim(),doc=$('#document').value.replace(/\D/g,''),type=$('#docType').value;if(!customer)return'Ingresá el nombre o comercio.';if(!city)return'Ingresá la localidad.';if(!address)return'Ingresá la dirección.';if(doc&&type==='DNI'&&(doc.length<7||doc.length>8))return'El DNI debe tener 7 u 8 números.';if(doc&&type==='CUIT'&&doc.length!==11)return'El CUIT debe tener 11 números.';return'';}
  function send(){const error=validate();$('#formError').textContent=error;if(error)return;const items=cartItems();if(!items.length)return;const lines=['*PEDIDO BIANI*','','Cliente: '+$('#customer').value.trim(),$('#docType').value+': '+($('#document').value.trim()||'No informado'),'Localidad: '+$('#city').value.trim(),'Dirección: '+$('#address').value.trim(),$('#notes').value.trim()?'Observaciones: '+$('#notes').value.trim():'','',...items.map(({p,qty})=>`• ${qty} x ${p.name} [${p.code}] — ${money(p.price*qty)}`),'','*TOTAL ESTIMADO: '+$('#total').textContent+'*','','Precios sujetos a confirmación.'];window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(lines.filter(Boolean).join('\n')),'_blank','noopener');}
  $('#search').oninput=e=>{state.query=e.target.value;apply();};$('#clear').onclick=()=>{$('#search').value='';state.query='';apply();$('#search').focus();};$('#sort').onchange=e=>{state.sort=e.target.value;apply();};$('#sinTacc').onclick=()=>{state.sinTacc=!state.sinTacc;$('#sinTacc').classList.toggle('active',state.sinTacc);apply();};$('#openCart').onclick=()=>{$('#cartOverlay').classList.add('open');renderCart();};$('#closeCart').onclick=()=>$('#cartOverlay').classList.remove('open');$('#cartOverlay').onclick=e=>{if(e.target.id==='cartOverlay')$('#cartOverlay').classList.remove('open');};$('#send').onclick=send;['customer','city','address','document'].forEach(id=>$('#'+id).oninput=()=>$('#formError').textContent='');saveCart();load();
})();
</script>
</body>
</html>
