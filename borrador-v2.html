<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Borrador V2 · Catálogo BIANI</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#172033;--muted:#687386;--gold:#c49a3a;--dark:#111827;--line:#e4e8ef;--ok:#16834a;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.search{width:100%;padding:12px 14px;border-radius:12px;border:0}.cartbtn{border:0;border-radius:12px;padding:12px 15px;font-weight:800}.status{max-width:1450px;margin:12px auto 0;padding:0 16px}.status>div{padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:12px}.ok{border-left:5px solid var(--ok)!important}.bad{border-left:5px solid var(--bad)!important}.wrap{max-width:1450px;margin:14px auto;padding:0 16px 40px;display:grid;grid-template-columns:230px 1fr;gap:16px}.cats{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content;position:sticky;top:76px}.cat{width:100%;border:0;background:transparent;padding:10px;border-radius:10px;text-align:left;display:flex;justify-content:space-between;cursor:pointer}.cat.active{background:#fff4d6;font-weight:800}.mainhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools select,.tools button{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pic{aspect-ratio:1;background:#fff;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:contain;padding:10px}.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.code{font-size:11px;color:var(--muted)}.name{font-weight:800;font-size:14px;line-height:1.3;min-height:38px}.price{font-size:20px;font-weight:900}.add{margin-top:auto;border:0;border-radius:10px;padding:10px;background:var(--dark);color:#fff;font-weight:800}.empty{grid-column:1/-1;padding:45px;text-align:center;background:#fff;border:1px dashed #cbd5e1;border-radius:16px}.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:#fff;z-index:40;box-shadow:-10px 0 35px #0003;display:none;flex-direction:column}.drawer.open{display:flex}.dhead{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.list{padding:15px;overflow:auto;flex:1}.item{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.step{display:flex;gap:6px;align-items:center}.step button{width:30px;height:30px}.foot{padding:15px;border-top:1px solid var(--line)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields input{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.full{grid-column:1/-1}.send{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:#25d366;font-weight:900}.err{color:var(--bad);font-size:12px;min-height:18px}.loader{position:fixed;inset:0;background:#f4f6f8ee;z-index:80;display:grid;place-items:center}.hidden{display:none!important}@media(max-width:800px){.top{grid-template-columns:1fr auto}.search{grid-column:1/-1}.wrap{grid-template-columns:1fr}.cats{position:static;display:flex;overflow:auto}.cat{min-width:max-content}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="loader" class="loader"><strong>Cargando catálogo desde Google Sheets…</strong></div>
<header class="top"><div class="brand">BIANI</div><input id="search" class="search" placeholder="Buscar producto, marca o código"><button id="openCart" class="cartbtn">🛒 <span id="countCart">0</span></button></header>
<div class="status"><div id="status">Conectando con la planilla…</div></div>
<div class="wrap"><aside id="cats" class="cats"></aside><main><div class="mainhead"><div><h1 id="title">Todos los productos</h1><div><span id="count">0</span> productos</div></div><div class="tools"><button id="sinTacc">Solo SIN TACC</button><select id="sort"><option value="default">Orden original</option><option value="name">Nombre A-Z</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select></div></div><section id="grid" class="grid"></section></main></div>
<aside id="drawer" class="drawer"><div class="dhead"><strong>Tu pedido</strong><button id="close">✕</button></div><div id="list" class="list"></div><div class="foot"><div class="fields"><input id="customer" class="full" placeholder="Nombre o comercio *"><input id="city" placeholder="Localidad *"><input id="address" placeholder="Dirección *"><input id="document" class="full" placeholder="DNI o CUIT (opcional)"></div><div id="err" class="err"></div><h3>Total: <span id="total">$ 0</span></h3><button id="send" class="send">Enviar pedido por WhatsApp</button></div></aside>
<script>
(()=>{'use strict';
const SHEET='179n3Fa7WUbA1ZlgtAVVlIaxbQdaP5CV49NhPY0Ulrn0',WA='5492954324063',BASE='https://biani.com.ar/';
const $=s=>document.querySelector(s),norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(Number(n)||0);
const state={products:[],filtered:[],cat:'',q:'',sin:false,sort:'default',cart:JSON.parse(localStorage.getItem('biani_draft_v2_cart')||'{}')};
function parseCSV(text){if(!text)return[];let d=',',first=(text.split('\n')[0]||'');if(first.includes(';')&&!first.includes(','))d=';';else if(first.includes('\t')&&!first.includes(','))d='\t';const out=[];let row=[''],q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){row[row.length-1]+='"';i++;}else q=!q;}else if(c===d&&!q)row.push('');else if((c==='\r'||c==='\n')&&!q){if(c==='\r'&&n==='\n')i++;out.push(row);row=[''];}else row[row.length-1]+=c;}if(row.length>1||row[0])out.push(row);return out;}
function price(v){let s=String(v||'').replace(/[$\s]/g,'');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return Number.isFinite(n)?n:0;}
function rowsToProducts(rows,imgMap,catMap){if(!rows.length)return[];const h=rows[0].map(norm);let ci=h.findIndex(x=>x.includes('cod')||x==='id'),ni=h.findIndex(x=>x.includes('art')||x.includes('nom')||x.includes('prod')||x.includes('det')),pi=h.findIndex(x=>x.includes('prec')||x.includes('cost')||x.includes('val')||x.includes('monto')),cati=h.findIndex(x=>x.includes('cat')),mi=h.findIndex(x=>x.includes('min'));const has=ci>=0||ni>=0||pi>=0||cati>=0;let start=has?1:0;if(!has){ci=0;ni=1;pi=rows[0].length===3?2:3;cati=rows[0].length===3?-1:2;}else{if(ci<0)ci=0;if(ni<0)ni=1;if(pi<0)pi=2;}const prods=[],occ={};for(let i=start;i<rows.length;i++){const r=rows[i];if(r.length<=Math.max(ci,ni,pi))continue;const raw=String(r[ci]||'').trim(),name=String(r[ni]||'').trim();if(!raw||!name)continue;occ[raw]=(occ[raw]||0)+1;const code=occ[raw]===1?raw:`${raw}_${occ[raw]-1}`;const image=imgMap[raw]||imgMap[code]||'';const category=catMap[raw]||catMap[code]||(cati>=0&&r[cati]?String(r[cati]).trim():'Varios')||'Varios';prods.push({code,name,price:price(r[pi]),category,image:image?new URL(image,BASE).href:'',min:mi>=0?parseInt(r[mi])||1:1});}return prods;}
async function json(url){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function load(){try{const [img,cat]=await Promise.all([json(BASE+'code_to_image.json'),json(BASE+'code_to_category.json')]);const urls=[`https://docs.google.com/spreadsheets/d/${SHEET}/gviz/tq?tqx=out:csv`, `https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv`];let text='',last='';for(const u of urls){try{const r=await fetch(u+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);text=await r.text();if(text&&text.length>20)break;}catch(e){last=e.message;}}if(!text)throw Error(last||'Sin respuesta de Google Sheets');const rows=parseCSV(text),products=rowsToProducts(rows,img,cat);if(!products.length)throw Error('La hoja respondió, pero no se reconocieron las columnas de productos');state.products=products;$('#status').className='ok';$('#status').textContent=`✓ ${products.length} productos cargados desde Google Sheets · borrador separado de producción`;renderCats();apply();}catch(e){$('#status').className='bad';$('#status').textContent='⚠️ '+e.message;$('#grid').innerHTML='<div class="empty"><strong>No se pudieron interpretar los productos.</strong><br>El catálogo publicado no fue modificado.</div>';}finally{$('#loader').classList.add('hidden');}}
function renderCats(){const counts={};state.products.forEach(p=>counts[p.category]=(counts[p.category]||0)+1);const names=['',...Object.keys(counts).sort((a,b)=>a.localeCompare(b,'es'))];$('#cats').innerHTML=names.map(c=>`<button class="cat ${state.cat===c?'active':''}" data-cat="${c.replace(/"/g,'&quot;')}"><span>${c||'Todos'}</span><span>${c?counts[c]:state.products.length}</span></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;$('#title').textContent=state.cat||'Todos los productos';renderCats();apply();});}
function apply(){let a=[...state.products];if(state.cat)a=a.filter(p=>p.category===state.cat);if(state.q){const q=norm(state.q);a=a.filter(p=>norm(p.name).includes(q)||norm(p.code).includes(q)||norm(p.category).includes(q));}if(state.sin)a=a.filter(p=>norm(p.name).includes('sin tacc')||norm(p.name).includes('sin tac'));if(state.sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name,'es'));if(state.sort==='asc')a.sort((a,b)=>a.price-b.price);if(state.sort==='desc')a.sort((a,b)=>b.price-a.price);state.filtered=a;$('#count').textContent=a.length;$('#grid').innerHTML=a.length?a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="" loading="lazy" onerror="this.remove()">`:'Sin imagen'}</div><div class="body"><div class="code">CÓD. ${p.code} · ${p.category}</div><div class="name">${p.name}</div><div class="price">${money(p.price)}</div><button class="add" data-code="${p.code}">Agregar</button></div></article>`).join(''):'<div class="empty">No hay productos para este filtro.</div>';document.querySelectorAll('.add').forEach(b=>b.onclick=()=>add(b.dataset.code));}
function save(){localStorage.setItem('biani_draft_v2_cart',JSON.stringify(state.cart));renderCart();}
function add(code){const p=state.products.find(x=>x.code===code);if(!p)return;state.cart[code]=(state.cart[code]||0)+(p.min||1);save();}
function renderCart(){const entries=Object.entries(state.cart).filter(([,q])=>q>0);$('#countCart').textContent=entries.reduce((s,[,q])=>s+q,0);let total=0;$('#list').innerHTML=entries.length?entries.map(([code,q])=>{const p=state.products.find(x=>x.code===code);if(!p)return'';total+=p.price*q;return`<div class="item"><div><strong>${p.name}</strong><small>${money(p.price)} c/u</small></div><div class="step"><button data-op="-" data-code="${code}">−</button><b>${q}</b><button data-op="+" data-code="${code}">+</button></div></div>`;}).join(''):'El carrito está vacío.';$('#total').textContent=money(total);document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const p=state.products.find(x=>x.code===b.dataset.code),step=p?.min||1;state.cart[b.dataset.code]=Math.max(0,(state.cart[b.dataset.code]||0)+(b.dataset.op==='+'?step:-step));save();});}
$('#search').oninput=e=>{state.q=e.target.value;apply();};$('#sort').onchange=e=>{state.sort=e.target.value;apply();};$('#sinTacc').onclick=()=>{state.sin=!state.sin;apply();};$('#openCart').onclick=()=>{$('#drawer').classList.add('open');renderCart();};$('#close').onclick=()=>$('#drawer').classList.remove('open');$('#send').onclick=()=>{const customer=$('#customer').value.trim(),city=$('#city').value.trim(),address=$('#address').value.trim();if(!customer||!city||!address){$('#err').textContent='Completá nombre, localidad y dirección.';return;}const items=Object.entries(state.cart).filter(([,q])=>q>0);if(!items.length){$('#err').textContent='El carrito está vacío.';return;}let total=0,msg=`*PEDIDO BIANI*\nCliente: ${customer}\nLocalidad: ${city}\nDirección: ${address}\nDocumento: ${$('#document').value.trim()||'-'}\n\n`;items.forEach(([code,q])=>{const p=state.products.find(x=>x.code===code);if(!p)return;const sub=p.price*q;total+=sub;msg+=`• ${p.name}\n  Código ${p.code} · ${q} u. · ${money(sub)}\n`;});msg+=`\n*TOTAL ESTIMADO: ${money(total)}*`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');};renderCart();load();})();
</script>
</body></html>
